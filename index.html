<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainBridge Collective tools</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Brand values mirror brand.md */
  html, body { margin: 0; background: #222529; }
  .bb-tools { box-sizing: border-box; max-width: 640px; margin: 0 auto; padding: 24px 16px; font-family: 'Poppins', system-ui, sans-serif; color: #B0B0B8; }
  .bb-tools h1 { color: #fff; font-weight: 600; font-size: 1.5rem; margin: 0 0 4px; }
  .bb-tools p { margin: 0 0 16px; font-size: .9rem; }
  .bb-tools ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .bb-tools a { display: block; background: #191B1D; border: 1px solid #464950; border-radius: 16px; padding: 14px 16px; color: #fff; font-weight: 500; text-decoration: none; }
  .bb-tools a:hover, .bb-tools a:focus-visible { border-color: #526D5E; outline: none; }
  .bb-tools a span { display: block; margin-top: 2px; color: #B0B0B8; font-size: .8rem; font-weight: 400; }
</style>
</head>
<body>
<main class="bb-tools">
  <h1>BrainBridge Collective tools</h1>
  <p>Small tools for members and visitors.</p>
  <ul>
    <li><a href="parking-map/">Where to park<span>Lots, garages and street parking near 731 E Walnut St, Pasadena</span></a></li>
    <!-- Add new tools here: <li><a href="folder/">Title<span>Short description</span></a></li> -->
  </ul>
</main>
</body>
</html>
